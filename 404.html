:root{--paper:#FAF6EF;--paper-2:#F2EBDD;--ink:#33402E;--ink-soft:#5A6750;--sage:#8FA483;--sage-deep:#5E7252;--line:#DED4C2;--serif:'Cormorant Garamond',Georgia,serif;--sans:'Mulish',system-ui,sans-serif;--util:'Jost',system-ui,sans-serif}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;font-family:var(--sans);color:var(--ink);background:radial-gradient(120% 90% at 50% -10%,color-mix(in srgb,var(--sage) 18%,var(--paper)),var(--paper) 70%);display:grid;place-items:center;text-align:center;padding:2rem;line-height:1.6}

p{color:var(--ink-soft);font-size:1.1rem;max-width:44ch;margin:.4rem auto 0}
.quote{font-family:var(--serif);font-style:italic;font-size:1.15rem;color:var(--ink);margin:1.4rem auto 0;max-width:40ch}
.links{display:flex;gap:.7rem;flex-wrap:wrap;justify-content:center;margin:2rem 0 0}
.links a{font-family:var(--util);font-size:.82rem;letter-spacing:.03em;text-decoration:none;border:1.5px solid var(--line);border-radius:999px;padding:.7em 1.3em;color:var(--ink);transition:all .2s}
.links a.solid{background:var(--sage-deep);color:#fff;border-color:var(--sage-deep)}
.links a:hover{border-color:var(--sage-deep)}
